# docker-compose.coolify.yml — Phase 1 (pilote qdrant)
# Test pipeline Coolify avant de migrer la stack complète `local-ai-packaged`.
# Une fois validé → remplacer par le compose complet (Phase 3, ~18 services).

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-pilot
    restart: unless-stopped
    expose:
      - "6333/tcp"
      - "6334/tcp"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  qdrant_storage:
    name: faktory-pilot_qdrant_storage
